name: Compare page

# Builds site/data.json from the lab results and publishes site/ to GitHub Pages.
# Needs Settings > Pages > Source: "GitHub Actions" on the repository.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "results/**"
      - "models/*/README.md"
      - "models/**/*.tmdl"
      - "docs/lab-findings*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data.json
        run: |
          pip install pyyaml==6.0.2
          python site/build_data.py

      - name: Collect the page files
        run: |
          mkdir _site
          cp site/index.html site/app.js site/style.css site/data.json site/og.png _site/
          cp -r site/tmdl _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
