# Display metadata for the compare page. The only hand-maintained file in site/.
# Numbers never go here: build_data.py reads them from results/ and docs/.
#
# Per model:
#   id             short id, the part of the key before the @ (v00, v99a, ...)
#   folder         folder under models/
#   name           display name
#   category       one of the categories below
#   desc           one or two short sentences: what changed
#   sizes          data sizes shown on the site (1M, 10M orders)
#   qnote          optional: note shown under the query charts
#   refnote        optional: note shown under the refresh charts
#   diffnote       optional: note shown above the diff against the baseline
#   pro            optional fallback: result on Power BI Pro when no harness
#                  Pro run exists. Harness Pro runs in harness-runs.csv win.
#   why            optional: one or two sentences, the mechanism behind what the lab measured
#   fix            optional: what to do instead
#   ignore_before  optional: skip refreshes before this time (an earlier
#                  version of the model, e.g. v99d's first four runs)

site:
  title: Compare two semantic models
  subtitle: Same Contoso data, one change at a time. Every number is measured.
  intro: Every model in the lab is the same clean baseline (v00) plus one change, refreshed and queried on real Fabric capacities. Pick two models and see what the change costs. 1M means 1 million orders, 2.35M sales rows; 10M means 23.7M sales rows.
  # Link preview text (Open Graph and Twitter tags in index.html, written by build_data.py)
  description: Pick two Power BI semantic models from the refresh memory lab and see what one change costs in refresh memory, capacity fit and query memory. Every number is measured on Fabric.
  # The published address. Change it when the site moves; the preview image link depends on it.
  url: https://fabricated-insights.github.io/semantic-model-refresh-test-public/
  repo: https://github.com/fabricated-insights/semantic-model-refresh-test-public
  branch: main
  # Article links. Leave url empty until the article is out; it then shows as plain text.
  articles:
    - label: Part 1
      url: https://fabricatedinsights.substack.com/p/power-bi-pro-vs-f64-1-0-why-your
    - label: Part 2
      url: ""
    - label: Part 3
      url: ""
  default: [v00@1M, v20@1M]

# "Read this before you quote a number". Keep in sync with the Caveats in
# docs/lab-findings.md and docs/lab-findings-queries.md.
caveats:
  - The source is Parquet over Web.Contents, which can't fold. With a folding source, sorts and Group By run in the database.
  - The clean baseline alone varied from 543 to 856 MB over 11 measured refreshes. Differences of a few hundred MB on 1M data are noise.
  - Query times on F64 switch between a fast and a slow state, about 2 times apart, for hours. The memory a query needs stays the same in both states.

categories:
  - Baseline
  - Power Query
  - Calculated objects
  - Model design
  - Measures and visuals
  - Kitchen sink

presets:
  - label: Clean vs two sorts
    a: v00@1M
    b: v20@1M
  - label: Clean vs bad DAX
    a: v00@1M
    b: v26@1M
  - label: Clean vs calculated tables
    a: v00@1M
    b: v23@1M
  - label: 1M vs 10M orders
    a: v00@1M
    b: v00@10M
  - label: "Kitchen sink: clean PQ vs everything"
    a: v99m@1M
    b: v99@1M
  - label: "One Table.Buffer that breaks F64"
    a: v99g@1M
    b: v99i@1M

models:
  - id: v00
    folder: v00-baseline
    name: Clean baseline
    category: Baseline
    desc: "A clean star schema: typed columns, no calculated columns or tables, single-direction relationships, Auto date/time off."
    why: "A clean star schema with typed columns, single direction relationships, no calculated columns or tables and Auto date/time off. On 1M it peaks at 543 to 856 MB on F64 over 11 runs for a 73 MB model, and it refreshes on F2 on both 1M and 10M (1,650 to 2,116 MB on 10M)."
    sizes: [1M, 10M]

  - id: v18
    folder: v18-pq-10m-summary
    name: Summary from the 10M file
    category: Power Query
    desc: Baseline plus a 590-row summary grouped in Power Query from the 10M file.
    why: "The summary table is small, but its source does not fold, so Power Query downloads, decodes and groups the whole 10M Sales file during refresh, even though that staging query is not loaded. The peak is 1,562 MB, about twice the baseline's 543 to 856 MB, with an unchanged 73 MB model. It still refreshed on F2."
    fix: "Count the Power Query work that a not-loaded query does, not only the rows that load. With a source that folds, a Group By runs in the database and does not cost refresh memory. On a file source the lab tested no alternative."
    sizes: [1M]
  - id: v19
    folder: v19-pq-heavy-10m
    name: Five heavy Power Query analyses
    category: Power Query
    desc: Baseline plus five Power Query analyses on 10M data (merges, Group By with distinct counts, rankings, a self join).
    why: "Five Power Query analyses on 10M (merges, Group By with distinct counts, rankings, a self join) load only small tables, yet they fail with 'The M evaluation exceeded the memory limit' at 14.4 to 24.5 GB, below F64's 25.6 GB model limit. This is a separate limit per Power Query evaluation. Premium Per User, with 100 GB per model, failed the same way at 22,186 MB."
    fix: "A larger capacity does not fix this: Premium Per User did not raise the Power Query limit. The query that failed every time was PQ Customer RFM, which ranks all 1.68M customers three times. The lab did not test a rewrite of it."
    sizes: [1M]
  - id: v20
    folder: v20-pq-sort
    name: Two sorts
    category: Power Query
    desc: Baseline plus two sorts of the Sales table in Power Query. The loaded table is identical.
    why: "A Table.Sort cannot stream: Power Query reads all 2.35M Sales rows into memory before it returns the first one. Two sorts take the peak to 5,229 to 5,269 MB against the baseline's 543 to 856 MB, and the refresh fails on F2. The loaded table is identical to the baseline at 72 MB."
    fix: "Remove the sorts. The model does not use row order, and v00 loads the same table without them. With a source that folds, a sort runs in the database and does not cost refresh memory."
    sizes: [1M]
  - id: v21
    folder: v21-pq-group-by
    name: One Group By
    category: Power Query
    desc: Baseline plus one summary table built with Group By in Power Query.
    why: "A Group By cannot stream. Power Query reads the whole 2.35M row fact and keeps every group, with its rows for the distinct count, until the last row is read. One small summary table takes the peak to 3,767 MB against the baseline's 543 to 856 MB and fails F2, with an 85 MB model."
    fix: "With a source that folds, the Group By runs in the database and does not cost refresh memory. For a non folding source like this one, the lab tested no alternative."
    sizes: [1M]

  - id: v22
    folder: v22-dax-calc-columns
    name: 8 calculated columns
    category: Calculated objects
    desc: Baseline plus 8 calculated columns on Sales (RELATED, RANKX, text, CALCULATE).
    why: "Eight calculated columns on Sales (RELATED, RANKX, a text label, CALCULATE with ALLEXCEPT) are computed after load at 0.6 to 3.5 s each. The part of the peak outside Power Query grows from about 110 to about 260 MB, while the total peak stays in the baseline's range (621 to 794 MB over 3 runs). The model grows from 73 to 101 MB."
    fix: "At this size calculated columns are not a refresh memory problem. Their cost is model size and refresh time. The lab did not test moving them to Power Query or to the source."
    sizes: [1M]
  - id: v23
    folder: v23-dax-calc-tables
    name: 4 calculated tables
    category: Calculated objects
    desc: "Baseline plus 4 calculated tables: a copy of Sales, a SUMMARIZECOLUMNS summary, a product by day CROSSJOIN, CALENDARAUTO."
    why: "A calculated table is built in memory in full before it is compressed. Four calculated tables raise the peak to about 1,405 MB on 1M (baseline 543 to 856 MB) and to about 13,062 MB on 10M (baseline 1,650 to 2,116 MB), so on 10M the model needs F64. The model grows from 73 to 184 MB on 1M."
    fix: "Drop calculated tables that no visual uses. v00 is the same model without them, and the report queries ran the same on both. Of the four, the SUMMARIZECOLUMNS summary built from measures is the most likely to set the peak (v35, v36)."
    sizes: [1M, 10M]
  - id: v31
    folder: v31-calc-columns-row
    name: 32 row-level calculated columns
    category: Calculated objects
    desc: Baseline plus 32 row-level calculated columns on Sales.
    why: "32 row by row calculated columns on Sales (RELATED text, LOOKUPVALUE, arithmetic, an order line key unique per row) are stored like imported columns. The model grows from 92.7 to 316.8 MB in memory (223 MB backup against 72.7 MB). The peak rises to 913 MB with Power Query at baseline level. Queries are unchanged because no visual uses the columns."
    fix: "Leave dimension attributes in their dimension tables instead of repeating them on 2.3M Sales rows with RELATED, as v00 does. Avoid a key column with one distinct value per row unless a visual needs it."
    sizes: [1M]
  - id: v32
    folder: v32-calc-columns-aggregate
    name: 30 aggregating calculated columns
    category: Calculated objects
    desc: Baseline plus 30 aggregating calculated columns.
    why: "30 aggregating calculated columns (SUMX over RELATEDTABLE, RANKX, FILTER with EARLIER) need the whole fact table for every row, but the peak stays in the baseline's range at 631 MB. They cost time and size instead: refresh CPU doubles to 121 s, and the model grows from 92.7 to 367.9 MB in memory."
    fix: "These columns cost no peak memory. Their cost is model size and refresh CPU. The lab tested no alternative, such as measures, for these statistics."
    sizes: [1M]
  - id: v35
    folder: v35-calc-tables-four-copies
    name: Calculated tables, four copies
    category: Calculated objects
    desc: v23 with four copies of Sales in the copy table (94.9M rows).
    why: "Four copies of Sales in the Sales Copy calculated table (94.9M rows instead of 23.7M on 10M) double the model to 2,803 MB and the refresh time to 17 minutes, yet the peak stays at 13,063 MB. The copy runs in parallel with the Sales Summary table, which is the most likely step to set the peak."
    fix: "A copy table costs model memory and refresh time, not peak memory. Drop copies of the fact that no visual uses. To lower the peak, look at measure-based summary tables instead (v36)."
    sizes: [10M]
  - id: v36
    folder: v36-calc-summary-month-grain
    name: Calculated tables, monthly summary
    category: Calculated objects
    desc: v23 with the summary by month instead of year.
    why: "Grouping the SUMMARIZECOLUMNS Sales Summary (three measures, one a DISTINCTCOUNT) by month instead of year adds about 3M rows and raises the peak by 1.7 GB, to 14,759 MB. v35 added 69M rows to a copy table and the peak did not move."
    fix: "The grain of a calculated summary built from measures drives the refresh peak, so keep it no finer than the report needs. The lab measured year against month only."
    sizes: [10M]

  - id: v24
    folder: v24-bidirectional
    name: Bidirectional relationship
    category: Model design
    desc: Sales to Customer filters in both directions.
    why: "The relationship is built the same way whichever direction it filters, so the refresh peak (608 MB) and the model (73 MB) match the baseline. On a single star the only query change was a slicer that now goes through Sales: 16 ms instead of 0 ms."
    fix: "No refresh or query memory cost on a single star. The risk shows up when there is a second fact table (v24b)."
    sizes: [1M]
  - id: v24a
    folder: v24a-second-fact
    name: Second fact table
    category: Model design
    desc: Baseline plus a second fact table, Orders (981K rows).
    why: "A second fact table, Orders (980,666 rows), adds 30 MB to the model. The peak of 933 MB is almost all Power Query and comes from one run, against a baseline whose Power Query peak varies by more than 300 MB between runs. With single direction relationships, a Category slicer does not filter Orders, and no warning is shown."
    fix: "This is the control for v24b and needs no fix for memory. The lab gives no tested way to make Product filter Orders; v24b shows that a bidirectional relationship is not the right way."
    sizes: [1M]
  - id: v24b
    folder: v24b-second-fact-bidirectional
    name: Second fact + bidirectional
    category: Model design
    desc: v24a with Sales to Customer in both directions.
    why: "With Sales to Customer bidirectional, a Category filter reaches Orders through Customer. 'Computers' then gives 966,183 orders placed by customers who ever bought a computer, while 422,638 orders actually contain a computer. Refresh worked (peak 1,102 MB, one run) and the Orders page got slower (16 to 78 ms), but the main cost is a wrong number with no error."
    fix: "Keep Sales to Customer single direction. For orders that contain a product category, count DISTINCTCOUNT ( Sales[Order Number] ) under the same filter, which gives the 422,638."
    sizes: [1M]
    qnote: "Orders page gives different numbers: 966,183 orders for Computers instead of 422,638."
  - id: v25
    folder: v25-many-to-many
    name: Many-to-many
    category: Model design
    desc: Baseline plus a customer segment table, many-to-many to Sales.
    why: "A segment that changes by year is joined to Sales on CustomerKey only, as many-to-many. Every segment then returns all sales, 2,298,959,216, because every customer was in every segment in some year. Refresh is unchanged (614 MB), and the segment page joins against 1,049,900 rows that a warm cache does not remove."
    fix: "Filter on customer and year together. TREATAS on both columns returns the year-matched Gold total of 769,523,321, 33.5 percent of sales."
    sizes: [1M]
    qnote: Every segment shows the total of all sales.
  - id: v28
    folder: v28-types-all-text
    name: Everything as text
    category: Model design
    desc: Almost every column loaded as text.
    why: "Text columns need a dictionary entry for every distinct value and cannot use value encoding. The model grows from 92.7 to 171.5 MB in memory, though the backup size is slightly smaller (69.1 against 72.7 MB). The refresh peak is 777 MB, with CPU at 108 s against 55 to 71 s. The largest query needed half the memory, 28 MB against 58 MB."
    fix: "Set the correct data types in Power Query as v00 does: whole numbers, dates and fixed decimals instead of text. Text dates and numbers also need extra sort columns to sort correctly."
    sizes: [1M]
  - id: v29
    folder: v29-keys-as-text
    name: Keys as text
    category: Model design
    desc: Key columns loaded as text.
    why: "Keys are the columns with the most distinct values (980,666 order numbers on 1M), and as text they need a hash dictionary instead of value encoding. The model grows from 92.7 to 141.9 MB in memory. Two of three refreshes peaked at 1,489 and 1,735 MB in Power Query, against at most 856 MB for v00; the third stayed at 665 MB. The largest query needed 28 MB against 58 MB."
    fix: "Convert keys to whole numbers in Power Query, as v00 does. Text keys halved the query memory in every run, but the model grew 1.5 times and two of three refreshes needed about twice the memory."
    sizes: [1M]
  - id: v30
    folder: v30-double-instead-of-fixed
    name: Decimal instead of fixed decimal
    category: Model design
    desc: Prices and costs as decimal number instead of fixed decimal.
    why: "Decimal number instead of fixed decimal for five price and cost columns made no measurable difference: model 92.9 against 92.7 MB in memory, peak 550 MB, same queries. Sales Amount differs by 1.23 on 2.3 billion, because fixed decimal rounds the 4,742 Net Price values that have a fifth decimal."
    fix: "At this size either type works. Fixed decimal stores four decimals, so it rounds source values that have more. Decimal number keeps them, with floating point rounding in the last digits."
    sizes: [1M]
  - id: v33
    folder: v33-auto-date-time
    name: Auto date/time on
    category: Model design
    desc: Auto date/time on, Date table marked.
    why: "With Auto date/time on, Desktop adds a hidden calculated date table for each date column that is not related to the marked Date table: Customer[Birthday], Store[Open Date] and Store[Close Date]. That adds 3.5 MB in memory (96.2 MB), and the peak stays in the baseline's range (554 to 619 MB)."
    fix: "Turn Auto date/time off under File > Options and settings > Options > Current file > Data load, as v00 does. With a marked Date table that the fact dates relate to, its cost here was only a few MB."
    sizes: [1M]
  - id: v34
    folder: v34-auto-date-time-no-date-table
    name: Auto date/time, no date table
    category: Model design
    desc: Auto date/time on, Date table not marked.
    why: "With the Date table not marked, Desktop also adds local date tables for Date[Date] and Date[End of Month], five in total. The model is 96.9 MB in memory against 92.7 MB, and the peak is 707 to 723 MB. The fact date columns still get none, because they are relationship keys."
    fix: "Mark the Date table as a date table and turn Auto date/time off, as v00 does. A model with no Date table at all would get a local table for each fact date column, which the lab did not test."
    sizes: [1M]

  - id: v26
    folder: v26-bad-dax
    name: Bad DAX measures
    category: Measures and visuals
    desc: Five of six measures rewritten in common bad DAX patterns. Same numbers in every visual.
    why: "Measures are not computed at refresh, so refresh (715 MB) and model size (73 MB) match the baseline. At query time, Margin as SUMX over two measures does a context transition for each Sales row and needs up to 2,655 MB for a query that returns 4 rows. Four visuals fail on F2 at its 1,024 MB per query limit, and a warm cache does not help."
    fix: "Write the measures as v00 does: Margin as [Sales Amount] - [Total Cost], Margin % with DIVIDE, and # Orders as DISTINCTCOUNT ( Sales[Order Number] ). FILTER ( Sales, Sales[Quantity] > 0 ) cost nothing measurable, because the engine turns it into a column filter."
    sizes: [1M]
  - id: v27
    folder: v27-high-cardinality-visuals
    name: High-cardinality visuals
    category: Measures and visuals
    desc: Baseline model, report page with tables of all orders, order lines and customers.
    why: "The model is unchanged, so refresh matches the baseline (616 MB). A table visual grouped by order lines (2.35M groups) needs 231 MB per query, 4 times the heaviest baseline visual. The engine groups every row before it cuts the result to the visible window, and a warm cache still leaves up to 88 MB."
    fix: "The cost is in the report, not the model. The lab tested no alternative layout. Check the per query peak of such visuals against the target SKU, for example F2's 1,024 MB per query."
    sizes: [1M]
    qnote: "High-cardinality page: 1,345 ms, 231 MB per query. On the 20-visual page it matches the baseline."
    diffnote: The semantic model is the baseline unchanged. The change is an extra report page, p27, with tables of all orders, order lines and customers.

  - id: v99
    folder: v99-kitchen-sink
    name: Kitchen sink
    category: Kitchen sink
    desc: "Every antipattern at once: Power Query staging, sorts, buffers, Group By, calculated tables and columns, relationships, Auto date/time."
    why: "Every antipattern combined gives a peak of 25,882 to 26,115 MB on Premium Per User over two runs, and 25,777 to 25,958 MB of it is Power Query, for a 622 MB model. It fails on F2 at 3,319 MB and on F64 at the 25.6 GB limit, yet it refreshed on Pro, in 31 minutes."
    fix: "The diagnostic path found the cause in Power Query, not in the model. One Table.Buffer on the shared Sales staging query takes it past F64. Even without any buffer, the sorts and the Group By each take it off F2. With the v00 Power Query (v99m) the peak drops to 627 MB."
    sizes: [1M]
    pro: refreshed
  - id: v99a
    folder: v99a-no-big-calc-tables
    name: Kitchen sink without big calculated tables
    category: Kitchen sink
    desc: v99 without the big calculated tables and the flat table.
    why: "Removing the four calculated tables and the Sales Flat table brings v99 down to 16,054 MB, of which 15,932 MB is Power Query. It refreshes on F64 but still fails on F2 at 3,099 MB."
    fix: "What remains is Power Query: text staging, sorts, Table.Buffer in Sales and the Group By in Customer Stats. Removing the buffers only reaches 12,992 MB (v99k). The v00 Power Query brings the peak to 627 MB (v99m)."
    sizes: [1M]
  - id: v99b
    folder: v99b-one-sales-copy
    name: Kitchen sink diagnostic, one Sales copy
    category: Kitchen sink
    desc: v99 with one Sales copy instead of two and an empty Product Date Grid. Diagnostic run B.
    why: "With one Sales copy and the crossjoin emptied, v99 still peaks at 25,684 MB on Premium Per User, 25,591 MB of it Power Query, and fails on F64. The calculated tables shrink the model (517 MB against 619 MB for v99) but not the refresh peak."
    fix: "Look at Power Query first. The Table.Buffer on stg Sales is what takes the kitchen sink past F64 (v99i); without it the full set of calculated tables refreshes at about 23,000 MB (v99g)."
    sizes: [1M]
  - id: v99c
    folder: v99c-crossjoin-only
    name: Kitchen sink diagnostic, crossjoin only
    category: Kitchen sink
    desc: v99 with the 10.1M row Product x Date crossjoin and an empty Sales Copy. Diagnostic run C.
    why: "With the 10.1M row crossjoin and no Sales copy, the peak on Premium Per User is 25,918 MB, 25,808 MB of it Power Query, and it fails on F64. The crossjoin adds model size, not refresh memory."
    fix: "Look at Power Query first. The Table.Buffer on stg Sales is what takes the kitchen sink past F64 (v99i); without it the full set of calculated tables refreshes at about 23,000 MB (v99g)."
    sizes: [1M]
  - id: v99d
    folder: v99d-power-query
    name: Kitchen sink diagnostic, unused query
    category: Kitchen sink
    desc: v99a plus a heavy Power Query query that nothing loads.
    ignore_before: "2026-11-04 20:00"
    why: "A heavy query that nothing loads or references is not evaluated at refresh. Three runs peak at 16,005 to 16,056 MB, the same as v99a's 16,054 MB. Four earlier runs of a first version, which also loaded Sales Flat with buffered staging, failed on F64 and are not shown."
    fix: "Unused queries are clutter, not a refresh cost. Remove them for readability, not to get memory back."
    sizes: [1M]
  - id: v99e
    folder: v99e-sales-flat
    name: Kitchen sink diagnostic, flat Sales table
    category: Kitchen sink
    desc: "v99d plus the flat Sales table built in Power Query: merges, sort and buffer."
    why: "Loading Sales Flat, Sales merged with four dimensions, sorted and buffered in Power Query, adds about 6.9 GB: 22,889 MB against 16,005 to 16,056 MB for v99d. It still refreshes on F64."
    fix: "Keep the star schema and let relationships do the join. The baseline answers the same questions without a flat table and peaks at 543 to 856 MB."
    sizes: [1M]
  - id: v99f
    folder: v99f-calc-tables
    name: Kitchen sink diagnostic, calculated tables
    category: Kitchen sink
    desc: v99e plus three of v99's four calculated tables.
    why: "Adding Sales Summary, the 10.1M row Product Date Grid and a second date table leaves the peak where it was: 22,752 MB against 22,889 MB for v99e. The model grows from 323 to 361 MB."
    fix: "On this model the calculated tables are not what drives refresh memory. Check them for model size instead, for example against Pro's 1,024 MB limit."
    sizes: [1M]
  - id: v99g
    folder: v99g-sales-copy
    name: Kitchen sink diagnostic, plus Sales copy
    category: Kitchen sink
    desc: v99f plus one DAX copy of Sales. v99 without the staging buffers.
    why: "One DAX copy of Sales takes the model from 361 to 535 MB, but the peak only from 22,752 to 23,025 to 23,039 MB. This is v99 without its staging buffers, and it refreshes on F64."
    fix: "The step that matters comes next: put the Table.Buffer steps back in the staging queries and it fails on F64 (v99h)."
    sizes: [1M]
  - id: v99h
    folder: v99h-staging-buffers
    name: Kitchen sink diagnostic, staging buffers
    category: Kitchen sink
    desc: v99g plus Table.Buffer in stg Sales and stg Customer.
    why: "Table.Buffer at the end of stg Sales and stg Customer takes v99g from about 23,030 MB to 25,939 MB on Premium Per User, and the refresh fails on F64 in all four runs. Neither staging query is loaded; other queries read them."
    fix: "Don't end a shared staging query with Table.Buffer. v99i and v99j show that the buffer on stg Sales is the one that matters."
    sizes: [1M]
  - id: v99i
    folder: v99i-buffer-stg-sales
    name: Kitchen sink diagnostic, buffer stg Sales
    category: Kitchen sink
    desc: v99g plus Table.Buffer in stg Sales only.
    why: "The Table.Buffer on stg Sales alone fails F64, in all four runs. stg Sales holds all 2.35M Sales rows as text and is read by Sales, Sales Flat and Customer Stats. Premium Per User measured 25,651 MB, and 23,893 MB in an earlier run, so the peak sits close to the 25,593 MB limit."
    fix: "Remove the buffer from stg Sales. Without it the same model refreshes on F64 at about 22,900 to 23,040 MB (v99g, v99j)."
    sizes: [1M]
  - id: v99j
    folder: v99j-buffer-stg-customer
    name: Kitchen sink diagnostic, buffer stg Customer
    category: Kitchen sink
    desc: v99g plus Table.Buffer in stg Customer only.
    why: "The Table.Buffer on stg Customer, 105k rows, changes nothing: 22,894 MB against 23,025 to 23,039 MB for v99g, and it refreshes on F64."
    fix: "A buffer on a small staging query was harmless here. The one on the 2.35M row fact was not (v99i)."
    sizes: [1M]
  - id: v99k
    folder: v99k-no-buffers
    name: Kitchen sink without Table.Buffer
    category: Kitchen sink
    desc: v99a without any Table.Buffer.
    why: "Without any Table.Buffer the model still needs 12,992 MB, almost all Power Query, and fails on F2. The sorts and the Group By run on text and read one staging query shared by two tables. Together they cost more than their sum: 13.0 GB against 5.3 GB and 3.5 GB when measured alone."
    fix: "Replace the Power Query with the v00 queries: read, rename, select, set types, with no sorts and no Group By over the fact. With the calculated columns, bidirectional relationships and Auto date/time kept, that gives 627 MB and refreshes on F2 (v99m)."
    sizes: [1M]
  - id: v99l
    folder: v99l-no-calc-columns
    name: Kitchen sink without calculated columns
    category: Kitchen sink
    desc: v99k without calculated columns.
    why: "Removing the eight calculated columns from v99k changes the peak by 114 MB, to 12,878 MB. The refresh still fails on F2, where the engine stopped it at 3,146 MB. The calculated columns are not what drives this model's refresh memory."
    fix: "Leave the calculated columns and fix the Power Query instead. v99m, which keeps the columns and uses the v00 Power Query, peaks at 627 MB."
    sizes: [1M]
  - id: v99m
    folder: v99m-baseline-pq
    name: Kitchen sink with clean Power Query
    category: Kitchen sink
    desc: v99k with the baseline Power Query. DAX antipatterns kept.
    why: "v99k with the v00 Power Query peaks at 627 MB and refreshes on F2, even though it keeps eight calculated columns on Sales, bidirectional relationships and Auto date/time. Against 12,992 MB for v99k, this shows that the Power Query half was the cause."
    fix: "This model is the fix for v99k's refresh memory. The other antipatterns it keeps have their own costs elsewhere, such as wrong totals from bidirectional filters with a second fact table (v24b)."
    sizes: [1M]
  - id: v99n
    folder: v99n-text-staging
    name: Kitchen sink, clean PQ + text staging
    category: Kitchen sink
    desc: v99m plus staging queries that turn every column into text.
    why: "Staging queries that turn every column into text and convert the types late leave the peak where it was: 624 MB against 627 MB for v99m, and it refreshes on F2. They cost time instead: 5.3 minutes against 0.8 on F64."
    fix: "Set types once, in the query that reads the file. Text staging is not what made v99k need 13 GB; the sorts and the Group By were (v99o, v99q)."
    sizes: [1M]
  - id: v99o
    folder: v99o-sorts
    name: Kitchen sink, clean PQ + sorts
    category: Kitchen sink
    desc: v99m plus the sorts.
    why: "Adding the full sorts of Sales and the sort of Product back to v99m raises the peak from 627 to 5,337 MB, of which 5,048 MB is Power Query, and the refresh fails on F2. A sort reads the whole table into memory before it returns the first row, the same effect as a Table.Buffer."
    fix: "Remove the sorts, because row order does not matter to the model (v20). With a source that folds, a sort runs in the database."
    sizes: [1M]
  - id: v99p
    folder: v99p-high-cardinality
    name: Kitchen sink, clean PQ + high cardinality
    category: Kitchen sink
    desc: v99m plus Order Line and Order DateTime, one distinct value per row.
    why: "Order Line and Order DateTime have one distinct value per row. They take the model from 102 to 175 MB, but the refresh peak only from 627 to 746 MB, inside the baseline's run-to-run spread, and it refreshes on F2."
    fix: "Drop columns nobody filters or groups by, or split date and time into two columns. The gain is model size more than refresh memory."
    sizes: [1M]
  - id: v99q
    folder: v99q-customer-stats
    name: Kitchen sink, clean PQ + Group By
    category: Kitchen sink
    desc: v99m plus the Group By table.
    why: "Adding the Customer Stats Group By over all 2.35M Sales rows back to v99m raises the peak from 627 to 3,477 MB, of which 3,243 MB is Power Query, and the refresh fails on F2. A Group By keeps every group until the last row is read."
    fix: "This is one of the two culprits the diagnostic path found, with the sorts. With a source that folds, the Group By runs in the database. For this file source the lab tested no alternative."
    sizes: [1M]
